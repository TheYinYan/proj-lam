<div class="header">
  <h1>{{title}}</h1>
</div>
<div class="cab">
  <div class="estado">
    @if (enchufado) {
    <span>Estado conexión eléctrica: ENCHUFADO</span>
    } @else {
    <span>Estado conexión eléctrica: DESENCHUFADO</span>
    }
  </div>
  <div class="estado">
    <span>{{'Último estado recibido: ' + this.estadoLampara}}</span>
  </div>
  <div class="boton">
    @if (enchufado) {
    <button (click)="onClickDesenchufa()">DESENCHUFAR</button>
    } @else {
    <button (click)="onClickEnchufar()">ENCHUFAR</button>
    }
  </div>
</div>

<app-lampara
  [enchufada]="enchufado"
  (estadoLampara)="onCambiosEstadoLampara($event)"
></app-lampara>
